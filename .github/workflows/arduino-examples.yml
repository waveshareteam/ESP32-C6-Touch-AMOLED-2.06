name: Arduino examples

on:
  pull_request:
    paths:
      - "examples/arduino/**"
      - "releases/**"
      - "config/toolchains.json"
      - ".github/workflows/arduino-examples.yml"
      - ".github/scripts/discover_arduino_examples.py"
      - ".github/scripts/test_ci_tools.py"
  push:
    branches:
      - main
    paths:
      - "examples/arduino/**"
      - "releases/**"
      - "config/toolchains.json"
      - ".github/workflows/arduino-examples.yml"
      - ".github/scripts/discover_arduino_examples.py"
      - ".github/scripts/test_ci_tools.py"
  workflow_dispatch:
    inputs:
      sketch:
        description: "Arduino sketch directory name, path, or all"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: arduino-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover sketches
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.examples.outputs.matrix }}
      has_examples: ${{ steps.examples.outputs.has_examples }}
      examples: ${{ steps.examples.outputs.examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test CI tooling
        run: python -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Discover changed Arduino sketches
        id: examples
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python .github/scripts/discover_arduino_examples.py \
              --example "${{ inputs.sketch }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python .github/scripts/discover_arduino_examples.py \
              --base-ref "${{ github.event.pull_request.base.sha }}" \
              --head-ref "${{ github.sha }}" \
              --fallback-all
          else
            before="${{ github.event.before }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              before=""
            fi
            python .github/scripts/discover_arduino_examples.py \
              --base-ref "$before" \
              --head-ref "${{ github.sha }}" \
              --fallback-all
          fi

      - name: Summary
        shell: bash
        run: |
          if [[ "${{ steps.examples.outputs.has_examples }}" == "true" ]]; then
            {
              echo "### Arduino sketches selected"
              echo
              echo '${{ steps.examples.outputs.examples }}' | tr ',' '\n' | sed '/^$/d' | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No first-party Arduino sketch changes detected." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build ${{ matrix.sketch }} (core ${{ matrix.arduino_core_version }})
    needs: discover
    if: needs.discover.outputs.has_examples == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino-ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "${{ matrix.board_manager_url }}"
          arduino-cli core install "esp32:esp32@${{ matrix.arduino_core_version }}" \
            --additional-urls "${{ matrix.board_manager_url }}"

      - name: Build sketch
        shell: bash
        run: |
          set -euo pipefail
          cp examples/arduino/libraries/lv_conf.h "${{ matrix.sketch }}/lv_conf.h"
          mkdir -p "build/arduino/${{ matrix.name }}"
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --libraries examples/arduino/libraries \
            --warnings default \
            --export-binaries \
            --output-dir "build/arduino/${{ matrix.name }}" \
            "${{ matrix.sketch }}"

      - name: Package flashable firmware
        run: |
          python releases/package_firmware.py arduino \
            --project "${{ matrix.sketch }}" \
            --build-dir "build/arduino/${{ matrix.name }}" \
            --framework-version "${{ matrix.arduino_core_version }}" \
            --fqbn "${{ matrix.fqbn }}" \
            --output-dir release-artifacts

      - name: Upload firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: firmware-arduino-${{ matrix.name }}-${{ matrix.arduino_core_version }}
          path: release-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
